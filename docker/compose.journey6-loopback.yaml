name: tzcup-j6-loopback

services:
  j6-oe-wrapper:
    profiles: [build-only]
    image: ${J6_OE_WRAPPER_IMAGE:-tzcup/journey6-oe-wrapper:local}
    build:
      context: ..
      dockerfile: docker/journey6/Dockerfile.oe-wrapper
      args:
        J6_OE_BASE_IMAGE: ${J6_OE_BASE_IMAGE:?set the local proprietary Journey6 OE image}
        J6_OE_ROOT: ${J6_OE_ROOT:-/opt/journey6}
    command: ["/bin/true"]

  discovery:
    image: ${J6_PC_GATEWAY_IMAGE:-tzcup/journey6-pc-gateway:local}
    build:
      context: ..
      dockerfile: docker/journey6/Dockerfile.algorithm-host
      args:
        J6_ALGORITHM_BASE_IMAGE: ${J6_PC_ROS_IMAGE:-ros:jazzy-ros-base}
        ROS_SETUP: /opt/ros/jazzy/setup.bash
    command:
      - /bin/bash
      - -lc
      - source "$${TZCUP_ROS_SETUP}" && exec fastdds discovery --server-id 0 --ip-address 0.0.0.0 --port 11811
    ports:
      - "127.0.0.1:11811:11811/udp"
    networks: [hil_transport]
    read_only: true
    tmpfs: [/tmp:size=64m]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  pc-gateway:
    image: ${J6_PC_GATEWAY_IMAGE:-tzcup/journey6-pc-gateway:local}
    build:
      context: ..
      dockerfile: docker/journey6/Dockerfile.algorithm-host
      args:
        J6_ALGORITHM_BASE_IMAGE: ${J6_PC_ROS_IMAGE:-ros:jazzy-ros-base}
        ROS_SETUP: /opt/ros/jazzy/setup.bash
    depends_on: [discovery]
    command:
      - /bin/bash
      - -lc
      - source "$${TZCUP_ROS_SETUP}" && source "$${TZCUP_WS_SETUP}" && exec ros2 run journey6_hil_gateway journey6_hil_gateway --ros-args -p evidence_directory:=/evidence -p use_sim_time:=true -r /clock:=/hil/clock
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-66}
      ROS_DISCOVERY_SERVER: discovery:11811
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    volumes:
      - ${HIL_EVIDENCE_DIR:?set HIL evidence directory}:/evidence
      - ../starter_ws/src/journey6_hil_gateway/config/hil_topic_qos_contract.yaml:/opt/tzcup/config/hil_topic_qos_contract.yaml:ro
    networks: [hil_transport]
    read_only: true
    tmpfs: [/tmp:size=128m]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  j6-algorithm:
    image: ${J6_ALGORITHM_IMAGE:-tzcup/journey6-algorithm-host:local}
    build:
      context: ..
      dockerfile: docker/journey6/Dockerfile.algorithm-host
      args:
        J6_ALGORITHM_BASE_IMAGE: ${J6_OE_WRAPPER_IMAGE:-tzcup/journey6-oe-wrapper:local}
        ROS_SETUP: ${J6_ROS_SETUP:?set the ROS setup file inside the local J6 OE image}
    depends_on: [discovery, pc-gateway]
    command:
      - /bin/bash
      - -lc
      - |
        source "$${TZCUP_ROS_SETUP}"
        source "$${TZCUP_WS_SETUP}"
        ps -ef > /evidence/HIL_J6_PROCESS_LIST.txt
        test -n "$${J6_ALGORITHM_COMMAND:-}"
        exec /bin/bash -lc "$${J6_ALGORITHM_COMMAND}"
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-66}
      ROS_DISCOVERY_SERVER: discovery:11811
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      J6_ALGORITHM_COMMAND: ${J6_ALGORITHM_COMMAND:?set the J6 algorithm graph command}
      TZCUP_HIL_NODE_NAMESPACE: /j6
      TZCUP_HIL_CONTRACT: /opt/tzcup/config/hil_topic_qos_contract.yaml
      TZCUP_RUNTIME_BUNDLE: /opt/tzcup/runtime
      TZCUP_MODEL_ARTIFACTS: /opt/tzcup/models
    volumes:
      - ${J6_RUNTIME_BUNDLE:?set the J6 runtime bundle directory}:/opt/tzcup/runtime:ro
      - ${J6_MODEL_ARTIFACTS:?set the model artifact directory}:/opt/tzcup/models:ro
      - ${HIL_EVIDENCE_DIR:?set HIL evidence directory}:/evidence
      - ../starter_ws/src/journey6_hil_gateway/config/hil_topic_qos_contract.yaml:/opt/tzcup/config/hil_topic_qos_contract.yaml:ro
    networks: [hil_transport]
    cap_add: [NET_ADMIN]
    read_only: true
    tmpfs: [/tmp:size=512m]
    security_opt: [no-new-privileges:true]
    restart: "no"

networks:
  hil_transport:
    driver: bridge
    internal: true
