<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TZcup 清扫任务控制台</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #07130f; color: #e8fff4; display: grid; place-items: center; }
    main { width: calc(100% - 40px); max-width: 880px; padding: 42px; border: 1px solid #285947; background: #0d2119; box-shadow: 0 24px 80px #0008; overflow: hidden; }
    .eyebrow { color: #74d9a6; letter-spacing: .14em; font-size: 12px; text-transform: uppercase; }
    h1 { font-size: clamp(30px, 5vw, 50px); line-height: 1.05; margin: 18px 0 14px; max-width: 760px; overflow-wrap: anywhere; }
    p { color: #a9c9bb; max-width: 620px; }
    form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; margin-top: 32px; }
    input, button { border: 1px solid #376957; padding: 15px 16px; font: inherit; }
    input { min-width: 0; background: #06100c; color: #fff; }
    #token { grid-column: 1 / -1; }
    button { background: #80f0bb; color: #062016; font-weight: 700; cursor: pointer; }
    pre { min-height: 130px; margin-top: 16px; padding: 18px; overflow: auto; background: #06100c; border-left: 3px solid #80f0bb; color: #bcebd5; }
    @media (max-width: 620px) {
      main { width: calc(100% - 20px); padding: 26px 22px; }
      form { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Authenticated task gateway · fail closed</div>
    <h1>只下达任务，不越过安全层。</h1>
    <p>输入“开始区域 A 清扫”“暂停”“紧急停止”等任务级指令。所有输出都经过固定 DSL、工具白名单、鉴权和幂等校验。</p>
    <form id="command-form">
      <input id="token" type="password" aria-label="访问令牌" placeholder="输入本地操作员令牌" autocomplete="off">
      <input id="command" aria-label="任务指令" value="开始区域 A 清扫" autocomplete="off">
      <button type="submit">验证指令</button>
    </form>
    <pre id="result" aria-live="polite">等待指令…</pre>
  </main>
  <script>
    const form = document.querySelector("#command-form");
    const result = document.querySelector("#result");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const token = document.querySelector("#token").value;
      sessionStorage.setItem("tzcup_operator_token", token);
      const response = await fetch("/api/v1/commands", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json",
          "Idempotency-Key": crypto.randomUUID()
        },
        body: JSON.stringify({command: document.querySelector("#command").value})
      });
      result.textContent = JSON.stringify(await response.json(), null, 2);
    });
  </script>
</body>
</html>
