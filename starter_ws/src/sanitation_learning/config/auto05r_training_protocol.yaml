schema_version: 1
stage: AUTO-05R
task: AUTO-05R-2-3
contract_version: 1
split_policy:
  development_readable: [train, train_world_holdout, val, D1, D2, D3, D4, D5]
  legacy_G4_D6_diagnostic: contaminated_diagnostic_only
  G5_SEALED_FINAL: sealed_not_created
description: |
  AUTO-05R-2/3 模型与训练协议冻结文件。本文件只冻结架构、训练和门槛合同，
  不证明任何模型已训练：在真实 G4 训练与 micro-overfit 运行完成之前，
  micro_overfit_pass 保持 false，AUTO-05R-2/3 状态保持 not_trained。
models:
  discovery:
    model_id: g4_discovery_detector_v1
    input_shape: [1, 3, 480, 640]
    architecture: resnet18_fpn_p3_p4_p5_fcos_lite_objectness_quality_ltrb
    seed: 20260805
  classifier:
    model_id: g4_candidate_crop_classifier_v1
    input_shape: [1, 3, 192, 192]
    architecture: crop_cnn_4_class
    seed: 20260806
  leaf:
    model_id: g4_leaf_segmenter_v1
    input_shape: [1, 10, 384, 512]
    architecture: area_unet_shared_encoder_independent_decoder
    seed: 20260807
  puddle:
    model_id: g4_puddle_segmenter_v1
    input_shape: [1, 10, 384, 512]
    architecture: area_unet_shared_encoder_independent_decoder
    seed: 20260808
micro_overfit:
  sample_counts:
    discovery_frames: 32
    classifier_crops: 64
    leaf_frames: 16
    puddle_frames: 16
  gates:
    discovery_recall_min: 0.98
    discovery_ap50_min: 0.95
    discovery_precision_min: 0.90
    discovery_false_proposals_per_frame_max: 0.50
    negative_fp_per_frame_max: 0.05
    classifier_macro_f1_min: 0.98
    paper_precision_min: 0.98
    classifier_background_specificity_min: 0.98
    classifier_hard_negative_specificity_min: 0.90
    leaf_iou_min: 0.95
    leaf_boundary_f1_min: 0.90
    leaf_negative_fp_per_frame_max: 0.05
    puddle_iou_min: 0.95
    puddle_boundary_f1_min: 0.90
    puddle_negative_fp_per_frame_max: 0.05
  gate_kind: capacity_only
  screening_claim_allowed: false
  product_claim_allowed: false
batch_proportions:
  positive: 0.30
  negative_only: 0.20
  paper_like_hard_negative: 0.10
  plastic_bottle: 0.10
  metal_can: 0.10
  paper_litter: 0.10
  leaf_pile: 0.05
  puddle: 0.05
optimizer:
  name: AdamW
  learning_rate: 0.0008
  weight_decay: 0.0001
  betas: [0.9, 0.999]
scheduler:
  name: CosineAnnealingLR
  t_max: 40
  eta_min: 0.0
epochs: 40
ema_decay: 0.999
early_stopping_patience: 8
amp: false
model_selection:
  allowed_splits: [train, train_world_holdout, val]
  allowed_diagnostics: [D1, D2, D3, D4, D5]
  test_split_readable_during_training: false
  hard_negative_mining_from_test: false
  legacy_G4_D6_diagnostic_readable: false
  G5_sealed_final_readable: false
  selection_metric: validation_discovery_recall
  constraint_aware: true
  load_best: true
  positive_early_stopping_patience: 8
onnx:
  opset: 17
  dynamic_axes: none
  custom_ops: []
  task_specific_parity_required: true
pretrained_backbone:
  PRETRAINED_REQUIRED: true
  weight_enum_api: official_torchvision_enums
  from_scratch_control: labelled_ablation_only
  from_scratch_control_product_ready: false
