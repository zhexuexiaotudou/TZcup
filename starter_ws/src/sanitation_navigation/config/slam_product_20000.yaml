slam_toolbox:
  ros__parameters:
    use_sim_time: true
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0
    # 2 million cells cover 200 x 100 m. This keeps the full product map
    # tractable while remaining below the 0.15 m topology-error threshold.
    resolution: 0.10
    # The physical scan maximum is 12.0 m. The mapping normalizer represents
    # a no-return ray as 11.99 m so Karto can raytrace observed free space.
    # Karto only suppresses the occupied endpoint when the reading is at or
    # above this threshold, so it must remain below the no-return sentinel.
    # Otherwise every no-return ray becomes a false wall at the lidar horizon.
    max_laser_range: 11.95
    minimum_time_interval: 0.20
    transform_timeout: 0.30
    tf_buffer_duration: 60.0
    stack_size_to_use: 80000000
    enable_interactive_mode: false
    # The 200 x 100 m campus contains long open stretches where max-range
    # no-return rays are rotationally symmetric. Sequential scan matching can
    # therefore pin motion to the scan centroid. Product mapping uses the RTK
    # GNSS + wheel/IMU odometry chain as its global pose authority.
    use_scan_matching: false
    use_scan_barycenter: true
    minimum_travel_distance: 0.20
    minimum_travel_heading: 0.15
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.10
    link_scan_maximum_distance: 2.0
    loop_search_maximum_distance: 4.0
    # Repetitive campus rows produced parallel duplicate obstacle boundaries
    # when Karto added loop constraints on top of authoritative RTK odometry.
    # Keep the graph in odometric mapping mode for this product profile.
    do_loop_closing: false
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.10
    loop_search_space_dimension: 10.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
