formal_scan_self_filter:
  ros__parameters:
    input_topic: /scan
    output_topic: /scan/navigation
    # Expanded-URDF mesh ray audit, transport/pregrasp/pick/deposit invariant:
    # 110 / 1081 rays hit sensor_mast_link (92) or gnss_mount_link (18).
    # Limits include one angular sample and 0.10 m range margin over the
    # maximum audited hit (3 sigma of 0.030 m sensor noise + 0.010 m mount).
    # Matched samples become NaN, not infinity, so occluded space behind the
    # vehicle is never invented as observed free space.
    angular_range_masks_rad:
      - -2.35619449
      - -2.15548163
      - 0.18
      - 2.07694181
      - 2.35619449
      - 0.31
    mesh_ray_occluded_count: 110
    mesh_ray_total_count: 1081
    geometry_source: reports/engineering/formal_vehicle_fov_occlusion_report.json
    # Preserve Gazebo's physical +Inf no-return samples. Converting the mostly
    # open 1081-ray scan into finite 12 m endpoints overloads Karto and makes
    # map->odom lag behind the navigation clock.
    normalize_positive_infinity: false
    expected_sensor_range_max_m: 30.0
    no_return_replacement_m: 12.0
