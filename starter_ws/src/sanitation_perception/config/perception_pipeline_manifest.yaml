schema_version: 2
pipeline_id: perception_pipeline_g4_placeholder
model_manifests:
  detector: detector_manifest.yaml
  classifier: classifier_manifest.yaml
  leaf_segmenter: leaf_segmenter_manifest.yaml
  puddle_segmenter: puddle_segmenter_manifest.yaml
runtime:
  backend: onnxruntime
  sync_tolerance_ms: 20.0
  frame_queue_depth: 2
  preprocess_spec: preprocess_spec.yaml
  postprocess_spec: postprocess_spec.yaml
  tracker_v2:
    association_distance_m: 0.30
    close_recovery_distance_m: 0.10
    minimum_image_iou: 0.05
    maximum_observation_gap_s: 0.50
    occlusion_recovery_s: 2.0
    duplicate_distance_m: 0.08
    confirmation_observations: 3
    confirmation_class_posterior: 0.70
    confirmation_score_ema: 0.60
    score_ema_alpha: 0.35
    defer_after_observations: 5
  watchdog:
    camera_stale_ms: 500.0
    maximum_latency_ms: 200.0
    sustained_latency_samples: 5
    maximum_consecutive_tf_errors: 3
    maximum_consecutive_session_errors: 2
status:
  formal_pipeline_pass: false
  live_pipeline_pass: false
  competition_pipeline_claim_allowed: false
