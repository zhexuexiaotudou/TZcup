  value_range: limited
  shape: [1, 960, 640]
  image_size: [640, 640]
  letterbox_pad_value: 114
models:
  detector:
    source_pipeline: pretrained_pc_integration_dev
    hbm_manifest: null
    postprocess_contract: yolo11_detect_v1
