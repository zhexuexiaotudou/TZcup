# Low-rate visual-acceptance image contract consumed by ros_gz_image/image_bridge.
#
# The specialized bridge requires identical Gazebo and ROS topic names and uses
# its default Reliable QoS (RELIABLE, VOLATILE).  This prevents 4.8 MB raw frames
# from being discarded when fragmented on loopback.  It has
# no lazy or queue-size parameters.  The launch starts it only for the 0.2 Hz
# nineteen-camera visual studio; normal high-bandwidth vehicle sensors retain
# their separate lazy, one-deep ros_gz_bridge contract.

- ros_topic_name: /formal_visual/front_left
  gz_topic_name: /formal_visual/front_left
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: DEFAULT_RELIABLE

