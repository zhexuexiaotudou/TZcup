# Product high-bandwidth Gazebo -> ROS interfaces.
#
# Keep the physical source rates and resolutions in the URDF.  These bridges
# subscribe lazily and use one-deep queues so an absent or slow ROS consumer
# cannot turn raw images / point clouds into an unbounded host-commit load.
# The two 1920x1080 fisheyes and organized Mid360 cloud use reliable transport:
# their multi-megabyte CycloneDDS samples otherwise lose fragments even on the
# pinned loopback data plane.  All other streams retain sensor-data QoS.
# Control-plane bridges intentionally remain in the launch file.

- ros_topic_name: /sensors/lidar_2d/scan/points
  gz_topic_name: /sensors/lidar_2d/scan/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  subscriber_queue: 1
  publisher_queue: 1
  lazy: true

