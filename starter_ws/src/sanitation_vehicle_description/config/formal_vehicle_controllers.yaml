controller_manager:
  ros__parameters:
    update_rate: 250
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    cleaning_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    storage_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    service_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    brush_controller:
      type: velocity_controllers/JointGroupVelocityController
    recovery_controller:
      type: velocity_controllers/JointGroupVelocityController

arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 2.0
      shoulder_pan_joint: {trajectory: 0.08, goal: 0.02}
      shoulder_lift_joint: {trajectory: 0.08, goal: 0.02}
      elbow_joint: {trajectory: 0.08, goal: 0.02}
      wrist_1_joint: {trajectory: 0.08, goal: 0.02}
      wrist_2_joint: {trajectory: 0.08, goal: 0.02}
      wrist_3_joint: {trajectory: 0.08, goal: 0.02}

gripper_controller:
  ros__parameters:
    joints: [robotiq_85_left_knuckle_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 2.0
      robotiq_85_left_knuckle_joint: {trajectory: 0.04, goal: 0.01}

cleaning_controller:
  ros__parameters:
    # The lift is powered.  Pitch and float are real passive compliance
    # joints and must not be disguised as position-controlled motors.
    joints: [cleaning_lift_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    constraints:
      # The P16 lift is a slow self-locking actuator.  On a safety cancel,
      # generate the stop from measured position/velocity instead of holding
      # the trajectory's ahead-of-plant position command.  At the 4.8 mm/s
      # physical speed limit this 50 mm/s^2 bound stops in about 0.23 mm.
      decelerate_on_cancel: true
      cleaning_lift_joint:
        max_deceleration_on_cancel: 0.05

storage_controller:
  ros__parameters:
    # The two full-size compartment lids are passive, manually latched service
    # parts.  Only the robot deposition gate has a product actuator (XW540).
    joints: [dry_deposit_gate_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

service_controller:
  ros__parameters:
    joints: [wastewater_drain_valve_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 1.0
      wastewater_drain_valve_joint: {trajectory: 0.08, goal: 0.02}

brush_controller:
  ros__parameters:
    joints: [left_side_brush_joint, right_side_brush_joint, central_roller_joint]
    interface_name: velocity

recovery_controller:
  ros__parameters:
    joints: [recovery_pump_joint]
    interface_name: velocity
