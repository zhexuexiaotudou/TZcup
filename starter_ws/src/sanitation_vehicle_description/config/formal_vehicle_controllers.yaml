controller_manager:
  ros__parameters:
    update_rate: 250
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    base_controller:
      type: diff_drive_controller/DiffDriveController
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    cleaning_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    storage_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    brush_controller:
      type: velocity_controllers/JointGroupVelocityController
    recovery_controller:
      type: velocity_controllers/JointGroupVelocityController

base_controller:
  ros__parameters:
    left_wheel_names: [front_left_wheel_joint, rear_left_wheel_joint]
    right_wheel_names: [front_right_wheel_joint, rear_right_wheel_joint]
    # Controller-effective A300 geometry from the current Clearpath model.
    # The visual/collision tyre mesh has a 0.1651 m physical radius; the
    # controller uses the documented 0.1625 m effective rolling radius.
    wheel_separation: 0.566
    wheel_radius: 0.1625
    wheels_per_side: 2
    publish_rate: 50.0
    position_feedback: true
    open_loop: false
    cmd_vel_timeout: 0.5
    use_stamped_vel: false

arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 2.0
      shoulder_pan_joint: {trajectory: 0.08, goal: 0.02}
      shoulder_lift_joint: {trajectory: 0.08, goal: 0.02}
      elbow_joint: {trajectory: 0.08, goal: 0.02}
      wrist_1_joint: {trajectory: 0.08, goal: 0.02}
      wrist_2_joint: {trajectory: 0.08, goal: 0.02}
      wrist_3_joint: {trajectory: 0.08, goal: 0.02}

gripper_controller:
  ros__parameters:
    joints: [robotiq_85_left_knuckle_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 2.0
      robotiq_85_left_knuckle_joint: {trajectory: 0.04, goal: 0.01}

cleaning_controller:
  ros__parameters:
    joints:
      - cleaning_lift_joint
      - squeegee_pitch_joint
      - squeegee_float_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]

storage_controller:
  ros__parameters:
    joints: [dry_bin_lid_joint, dry_deposit_gate_joint, wastewater_lid_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

brush_controller:
  ros__parameters:
    joints: [left_side_brush_joint, right_side_brush_joint, central_roller_joint]
    interface_name: velocity

recovery_controller:
  ros__parameters:
    joints: [recovery_pump_joint]
    interface_name: velocity
