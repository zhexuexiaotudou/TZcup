$schema: https://json-schema.org/draft/2020-12/schema
$id: https://tzcup.local/schemas/journey6-source-bundle-v1
type: object
additionalProperties: false
required: [schema_version, bundle_id, target_family, target_sku, target_march, source_only, components]
properties:
  schema_version: {const: 1}
  bundle_id: {type: string, pattern: "^[a-z0-9][a-z0-9._-]+$"}
  target_family: {const: journey6}
  target_sku: {const: auto}
  target_march: {const: auto}
  source_only: {const: true}
  components:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, path, copy_policy, expected_sha256]
      properties:
        id: {type: string, pattern: "^[a-z][a-z0-9_]+$"}
        path: {type: [string, "null"]}
        copy_policy: {const: reference_only}
        expected_sha256: {type: [string, "null"], pattern: "^[0-9a-f]{64}$"}
