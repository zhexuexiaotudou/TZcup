    expected_lowest_z_at_work_pose_m: 0.000
    contact_status: geometrically_tangent_runtime_contact_pending
  suction_nozzle:
    center_xy_m: [-0.405, 0.000]
    collision_size_xyz_m: [0.100, 0.650, 0.085]
    expected_lowest_z_at_work_pose_m: 0.005
    contact_status: geometric_clearance_runtime_contact_pending
  transverse_union:
    minimum_y_m: -0.695
    maximum_y_m: 0.695
    geometric_sweep_width_m: 1.390
    declared_effective_cleaning_width_m: 1.320
    effective_width_is_not_inferred_from_collision: true
