    inertia_and_collision: reports/engineering/formal_vehicle_inertia_and_swept_volume_report.json

drive:
  kinematic_model: four_wheel_skid_steer
  steering_joint_names: []
  wheel_joint_names:
    - front_left_wheel_joint
    - front_right_wheel_joint
    - rear_left_wheel_joint
    - rear_right_wheel_joint
  physical_wheel_radius_m: 0.1651
  controller_wheel_radius_m: 0.1625
  geometric_wheel_separation_m: 0.5658
  controller_wheel_separation_m: 0.562
  wheelbase_m: 0.512
  effective_skid_steer_separation_m: null
  effective_separation_status: pending_load_surface_calibration
  canonical_planning_kinematic_constraint: curvature_limited_reference_path_for_skid_steer
  canonical_constraint_claim:
    physical_steering_claim: false
    runtime_tracking_status: pending_skid_steer_tracking_validation
  virtual_ackermann_constraint:
    compatibility_alias_for: curvature_limited_reference_path_for_skid_steer
    permitted_as_path_regularizer: true
    represents_physical_steering: false
    minimum_turning_radius_status: pending_skid_steer_tracking_validation

motion_footprints:
  transport_stowed:
    footprint_xy_m:
      - [0.620, 0.675]
      - [0.620, -0.675]
      - [-0.540, -0.675]
      - [-0.540, 0.675]
    source: formal_vehicle_layout.vehicle_envelopes.transport_stowed
    navigation_allowed: true
    geometry_status: conservative_envelope_pending_exact_mesh_sweep
  cleaning_deployed:
    footprint_xy_m:
      - [0.620, 0.695]
      - [0.620, -0.695]
      - [-0.540, -0.695]
      - [-0.540, 0.695]
    source: union_of_transport_envelope_and_side_brush_collision_sweeps
    navigation_allowed: true
    geometry_status: urdf_collision_union_contact_validation_pending
  arm_deployed:
    footprint_xy_m:
      - [1.300, 1.050]
      - [1.300, -1.280]
      - [-1.100, -1.280]
      - [-1.100, 1.050]
    source: formal_vehicle_layout.arm_envelopes.deployed
    navigation_allowed: false
    geometry_status: navigation_inhibited_pending_moveit_joint_space_sweep

cleaning_work_pose:
  lift_coordinate_semantics:
    zero_position: transport_safe_raised
    positive_direction: downward
    transport_joint_position_m: 0.000
    full_down_work_position_m: 0.100
    zero_pose_minimum_ground_clearance_m: 0.100
  joint_positions:
    cleaning_lift_joint_m: 0.100
    squeegee_float_joint_m: 0.000
    squeegee_pitch_joint_rad: 0.000
  command_interlock:
    minimum_cleaning_lift_joint_m: 0.100
    maximum_cleaning_lift_joint_m: 0.100
    tolerance_m: 0.001
  expected_ground_plane_z_m: 0.000
  geometry_only: true

mechanism_sweeps:
  left_side_brush:
    center_xy_m: [0.385, 0.545]
    radius_m: 0.150
    collision_thickness_m: 0.026
    expected_lowest_z_at_work_pose_m: 0.000
    contact_status: compressed_flexible_bristle_proxy_ground_tangent
  right_side_brush:
    center_xy_m: [0.385, -0.545]
    radius_m: 0.150
    collision_thickness_m: 0.026
    expected_lowest_z_at_work_pose_m: 0.000
    contact_status: compressed_flexible_bristle_proxy_ground_tangent
  central_roller:
    center_xy_m: [0.155, 0.000]
    radius_m: 0.100
    width_m: 0.620
    expected_lowest_z_at_work_pose_m: 0.000
