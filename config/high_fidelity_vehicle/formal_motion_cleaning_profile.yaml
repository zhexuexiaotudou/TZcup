schema_version: 1
profile_id: tzcup_formal_motion_cleaning_v1
units: SI
base_frame: base_footprint

claim_boundary:
  source_geometry_status: machine_checked_against_project_urdf
  physical_ground_contact_status: pending_runtime_contact_and_normal_force_validation
  exact_transport_mesh_sweep_status: pending
  exact_arm_swept_volume_status: pending
  effective_cleaning_width_status: pending_physical_soiling_test

arm_task_poses:
  joint_names:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  transport_rad: [-1.0, -1.0, 1.8, -1.5, -1.55, 0.25]
  pregrasp_rad: [-1.48278161, -0.44199397, 1.21471947, -2.34352182, -1.57079633, -3.05357794]
  pick_rad: [-1.48278161, 0.10260211, 0.80254082, -2.47593926, -1.57079633, -3.05357794]
  deposit_rad: [-0.30233498, -1.56960444, -0.73057657, -2.40638971, 1.56851193, 0.60324332]
  deposit_auxiliary_joint_positions:
    dry_deposit_gate_joint_rad: 1.05
  cube_pick_window:
    cube_center_xyz_m: [0.300, -0.950, 0.017]
    pregrasp_tool0_xyz_m: [0.300, -0.950, 0.450]
    pick_tool0_xyz_m: [0.300, -0.950, 0.190]
  dry_hopper_release:
    tool0_xyz_m: [-0.205, 0.035, 1.260]
  validation_reports:
