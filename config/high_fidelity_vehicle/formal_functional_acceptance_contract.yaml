    report_id: tzcup_formal_vehicle_product_visual_acceptance_v4
    success_statuses: [GAZEBO_OGRE2_PRODUCT_NINETEEN_FUNCTIONAL_VIEW_CAPTURE_PASSED]
    required_values:
      passed: true
