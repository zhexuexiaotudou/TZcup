      engineering_visual_crosswalk.inspected_physical_link_count: 156
      runtime_gate_binding.status: FORMAL_RUNTIME_GATE_BOUND
      runtime_gate_binding.acceptance_session_binding.session_status_at_gate: FORMAL_FINAL_ACCEPTANCE_SESSION_RUNNING
      runtime_gate_binding.acceptance_session_binding.snapshot_current_source_verified: true
      runtime_gate_binding.runtime_closure_binding.status: FORMAL_FINAL_RUNTIME_CLOSURE_VERIFIED
    required_mapping_keys:
      frames: &visual_views [front_left, rear_right, top_cleaning, sensor_tower_detail, front_sensor_detail, arm_mount_detail, dry_deposition_detail, cleaning_head_detail, rear_service_detail, power_compute_detail, storage_recovery_detail, rear_left_sensor_detail, rear_right_sensor_detail, drivetrain_detail, inertial_power_detail, dry_deposition_internal, power_safety_internal, charge_interface_detail, drain_interface_detail]
      profile_evidence_scope: *visual_views
      view_target_contract: *visual_views
    required_mapping_item_values: &visual_frame_values
      frames:
        width: 1600
        height: 1000
        semantic_visibility.passed: true
        semantic_visibility.method: source_bound_urdf_entity_projection
    session_bound: true
    bound_file_mapping: frames
    snapshot_source_hash_field: source_binding.source_inventory_sha256
    runtime_binding:
