schema_version: 1
contract_id: tzcup_formal_functional_acceptance_contract_v1
claim_boundary: >-
  This contract is a fail-closed crosswalk from every registered physical
  function position to the runtime evidence that proves its intended effect.
  A valid URDF link, joint or topic alone is not runtime acceptance. Missing
  evidence remains pending and historical evidence must be rerun after the
  final source snapshot is frozen.

acceptance_session:
  path: artifacts/formal_final_acceptance_session.json
  snapshot_manifest: reports/engineering/formal_vehicle_snapshot_manifest.json
  accepted_statuses:
    - FORMAL_FINAL_ACCEPTANCE_SESSION_RUNNING
    - FORMAL_FINAL_ACCEPTANCE_SESSION_PENDING
    - FORMAL_FINAL_ACCEPTANCE_SESSION_COMPLETE

evidence_gates:
  component_register:
    path: reports/engineering/formal_vehicle_component_register_report.json
    success_statuses: [COMPONENT_REGISTER_URDF_FK_AND_INTERFACES_VALID]
    session_bound: true
    snapshot_urdf_hash_field: urdf_sha256
  product_visual_acceptance:
