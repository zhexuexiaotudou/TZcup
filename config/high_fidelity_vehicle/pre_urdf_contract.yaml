  dry_bin_usable_min_l: 40.0
  cleaning_width_min_m: 0.6
  dry_cleaning_efficiency_min_m2_h: 3500.0
  puddle_depth_max_m: 0.01
  puddle_recovery_project_target: 0.95
  water_mass_balance_relative_error_max: 0.01

