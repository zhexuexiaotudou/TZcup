  - front_rgbd
  - wrist_rgbd
  - rear_left_fisheye
  - rear_right_fisheye
  - gnss
  - imu
  - side_brush_actuation
  - cleaning_lift
  - wastewater_recovery
  - cleaning_mechanism
  - dry_wet_storage
  - compute

sensor_contracts:
  - id: utm30lx
    frame: lidar_2d_link
    topic: /sensors/lidar_2d/scan
    update_rate_hz: 40.0
    range_min_m: 0.1
    range_max_m: 30.0
    horizontal_fov_deg: 270.0
    vertical_fov_deg: 0.0
    dimensions_m: [0.06, 0.06, 0.087]
  - id: mid360
    frame: lidar_3d_link
    topic: /sensors/lidar_3d/points
    update_rate_hz: 10.0
    range_min_m: 0.1
    range_max_m: 40.0
    horizontal_fov_deg: 360.0
    vertical_fov_deg: 59.0
    dimensions_m: [0.065, 0.065, 0.06]
  - id: front_d435_depth
    frame: front_rgbd_depth_optical_frame
    topic: /sensors/front_rgbd/depth/image_rect_raw
    update_rate_hz: 30.0
    range_min_m: 0.2
    range_max_m: 10.0
    horizontal_fov_deg: 87.0
    vertical_fov_deg: 58.0
    dimensions_m: [0.09, 0.025, 0.025]
  - id: wrist_d435_depth
    frame: wrist_rgbd_depth_optical_frame
    topic: /sensors/wrist_rgbd/depth/image_rect_raw
    update_rate_hz: 30.0
    range_min_m: 0.2
    range_max_m: 3.0
    horizontal_fov_deg: 87.0
    vertical_fov_deg: 58.0
    dimensions_m: [0.09, 0.025, 0.025]
  - id: rear_left_fisheye
    frame: rear_left_fisheye_optical_frame
    topic: /sensors/rear_left_fisheye/image_raw
    update_rate_hz: 30.0
    range_min_m: 0.2
    range_max_m: 20.0
    horizontal_fov_deg: 150.0
    vertical_fov_deg: 129.0
    dimensions_m: [0.038, 0.038, 0.02]
    distortion_model: equidistant
  - id: rear_right_fisheye
    frame: rear_right_fisheye_optical_frame
    topic: /sensors/rear_right_fisheye/image_raw
    update_rate_hz: 30.0
    range_min_m: 0.2
    range_max_m: 20.0
    horizontal_fov_deg: 150.0
    vertical_fov_deg: 129.0
    dimensions_m: [0.038, 0.038, 0.02]
    distortion_model: equidistant
  - id: gnss
    frame: gnss_antenna_link
    topic: /sensors/gnss/fix
    update_rate_hz: 10.0
    range_min_m: 0.0
    range_max_m: 1.0
    horizontal_fov_deg: 360.0
    vertical_fov_deg: 180.0
    dimensions_m: [0.06, 0.06, 0.02]
  - id: imu
    frame: imu_link
    topic: /sensors/imu/data
    update_rate_hz: 200.0
    range_min_m: 0.0
    range_max_m: 1.0
    horizontal_fov_deg: 360.0
    vertical_fov_deg: 180.0
    dimensions_m: [0.036, 0.033, 0.009]

frame_contract:
  required_frames:
    - base_footprint
    - base_link
    - payload_deck_link
    - sensor_mast_link
    - lidar_2d_link
    - lidar_3d_link
    - front_rgbd_link
    - front_rgbd_depth_optical_frame
    - rear_left_fisheye_link
    - rear_left_fisheye_optical_frame
    - rear_right_fisheye_link
    - rear_right_fisheye_optical_frame
    - gnss_antenna_link
    - imu_link
    - arm_mount_link
    - wrist_rgbd_link
    - wrist_rgbd_depth_optical_frame
    - dry_bin_link
    - wastewater_tank_link
    - left_side_brush_link
    - right_side_brush_link
    - central_roller_link
    - squeegee_link
    - suction_nozzle_link
  transform_policy:
    status: positions_intentionally_unset_until_collision_and_fov_layout_solve
    units: SI
    optical_frame_convention: REP-103
    base_frame_convention: REP-105

joint_contract:
  - name: left_side_brush_joint
    type: continuous
    actuator: Pololu-4694
    command_interface: velocity
  - name: right_side_brush_joint
    type: continuous
    actuator: Pololu-4694
    command_interface: velocity
  - name: central_roller_joint
    type: continuous
    actuator: Pololu-4694
    command_interface: velocity
  - name: cleaning_lift_joint
    type: prismatic
    actuator: Actuonix-P16-100-256-12-P
    command_interface: position
    lower_m: 0.0
    upper_m: 0.1
  - name: squeegee_pitch_joint
    type: revolute
    actuator: passive_spring_damper
    command_interface: none
    lower_rad: -0.174533
    upper_rad: 0.174533
  - name: squeegee_float_joint
    type: prismatic
    actuator: passive_spring_damper
    command_interface: none
    lower_m: -0.015
    upper_m: 0.015
  - name: dry_bin_lid_joint
    type: revolute
    actuator: passive_latch
    command_interface: none
    lower_rad: 0.0
    upper_rad: 1.570796
  - name: wastewater_lid_joint
    type: revolute
    actuator: passive_latch
    command_interface: none
    lower_rad: 0.0
    upper_rad: 1.570796

mass_capacity_budget:
  a300_payload_limit_kg: 101.5
  payload_design_factor: 0.9
  payload_design_limit_kg: 91.35
  known_payload_items:
    arm_ur5e: 20.6
    arm_control_box: 12.0
    gripper_2f85: 0.9
    lidar_utm30lx: 0.37
    lidar_mid360: 0.265
    front_and_wrist_d435: 0.15
    two_fisheye_modules: 0.08
    gnss_receiver_and_antenna: 0.1
    imu_vn100: 0.015
    three_brush_gearmotors: 0.615
    cleaning_lift: 0.11
    recovery_pump: 2.5
  engineering_allowances:
    s100_enclosure_and_io: 2.0
    split_bin_structure: 9.0
    brushes_roller_squeegee_hoses: 10.0
    arm_pedestal_and_structural_frame: 8.0
    wiring_fuses_and_dc_converters: 4.0
    filters_valves_and_strainer: 3.0
    sensor_mast_and_mounts: 4.0
  dry_trash:
    cube_count_max: 20
    cube_edge_m: 0.03
    material_density_kg_m3:
      cardboard: [300.0, 700.0]
      pp: [890.0, 920.0]
      pet: [1330.0, 1450.0]
      aluminum: [2600.0, 2800.0]
  dry_bin:
    geometric_volume_l: 45.0
    usable_volume_l: 40.0
    separated_from_wastewater: true
  wastewater:
    density_kg_l: 1.0
    nominal_design_cap_l: 20.0
    usable_fraction: 0.8
    episode_fraction_of_usable: 0.875
    cog_limit_l: null
    installation_space_limit_l: null
    final_capacity_policy: Minimum of mass, CoG, installation-space and 20 L limits; null layout limits remain formal URDF gates.

power_budget:
  base_user_rails:
    sensor_12v:
      voltage_v: 12.0
      current_limit_a: 10.0
    sensor_24v:
      voltage_v: 24.0
      current_limit_a: 5.0
    high_current_vbat:
      voltage_v: null
      current_limit_a: 40.0
      note: Exact A300 battery voltage and approved converter topology must be frozen from the selected platform manual before wiring design.
  loads:
    - {id: ur5e_controller, rail: isolated_vbat_dc_bus, continuous_w: 350.0, peak_w: 500.0, status: engineering_upper_bound}
    - {id: recovery_pump, rail: isolated_vbat_dc_bus, continuous_w: 144.0, peak_w: 144.0, status: datasheet_max}
    - {id: three_brush_motors, rail: isolated_vbat_dc_bus, continuous_w: 72.0, peak_w: 216.0, status: datasheet_stall_bound}
    - {id: cleaning_lift, rail: sensor_12v, continuous_w: 6.0, peak_w: 30.0, status: engineering_upper_bound}
    - {id: mid360, rail: sensor_24v, continuous_w: 6.5, peak_w: 14.0, status: datasheet}
    - {id: utm30lx, rail: sensor_12v, continuous_w: 8.4, peak_w: 12.0, status: datasheet}
    - {id: cameras_and_positioning, rail: sensor_12v, continuous_w: 18.0, peak_w: 30.0, status: engineering_upper_bound}
    - {id: s100_compute, rail: isolated_vbat_dc_bus, continuous_w: 45.0, peak_w: 80.0, status: provisional_until_exact_sku_measurement}
  rail_policy:
    sensor_12v_peak_max_w: 120.0
    sensor_24v_peak_max_w: 120.0
    high_power_loads_require_isolated_vbat_dc_bus: true

layout_gates_during_urdf:
  - id: exact_s100_board_envelope
    owner: user_measurement_plus_datasheet
    pass_condition: Exact owned board SKU, enclosure, connectors, mass and mounting holes recorded.
  - id: full_inertia_and_cog_scan
    owner: cad_and_simulation
    pass_condition: All component inertias and arm/tank extrema remain inside the A300 stability envelope.
  - id: fov_occlusion_solve
    owner: cad_and_sensor_simulation
    pass_condition: Exact transforms pass self-occlusion, blind-zone and 3 cm target visibility maps.
  - id: final_wastewater_capacity
    owner: cad_and_mass_solver
    pass_condition: CoG and installation-space limits are non-null and capacity is recomputed without exceeding payload.
  - id: vendor_geometry_rights
    owner: license_audit
    pass_condition: Only openly redistributable upstream meshes or project-authored geometry derived from public dimensions enter Git.
  - id: detailed_power_topology
    owner: electrical_design
    pass_condition: Exact VBAT voltage, converters, fuses, wire gauges, continuous and peak currents pass.

readiness_policy:
  ready_status: READY_FOR_URDF_IMPLEMENTATION_WITH_LAYOUT_GATES
  forbidden_claims:
    - final_vehicle_cog_passed
    - final_wastewater_capacity_frozen
    - exact_sensor_mounts_frozen
    - s100_physical_integration_passed
    - gazebo_high_fidelity_vehicle_executed
