schema_version: 1
contract_id: competition_vehicle_pre_urdf_v1
verified_at_utc: "2026-08-25T08:00:00Z"
scope:
  formal_profile: high_fidelity_competition_vehicle
  ros_distribution: jazzy
  gazebo_release: harmonic
  creates_formal_urdf: false
  purpose: Freeze traceable inputs and fail-closed gates before detailed CAD/Xacro work.

competition_requirements:
