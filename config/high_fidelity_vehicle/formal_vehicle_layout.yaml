  - {id: rear_left_fisheye, frame: rear_left_fisheye_optical_frame, xyz_m: [-0.585, 0.290, 0.6001], forward_xyz: [-0.906, 0.423, -0.087], approximate_clear_fraction: 0.97, minimum_clear_fraction: 0.90, pending: false}
  - {id: rear_right_fisheye, frame: rear_right_fisheye_optical_frame, xyz_m: [-0.585, -0.290, 0.6001], forward_xyz: [-0.906, -0.423, -0.087], approximate_clear_fraction: 0.97, minimum_clear_fraction: 0.90, pending: false}
  - {id: gnss, frame: gnss_antenna_link, xyz_m: [-0.190, 0.160, 1.1801], forward_xyz: [0.000, 0.000, 1.000], approximate_clear_fraction: 0.98, minimum_clear_fraction: 0.95, pending: false}
  - {id: imu, frame: imu_link, xyz_m: [0.000, 0.000, 0.4091], forward_xyz: [1.000, 0.000, 0.000], approximate_clear_fraction: 1.00, minimum_clear_fraction: 1.00, pending: false}
  - {id: wrist_d435_depth, frame: wrist_rgbd_depth_optical_frame, xyz_m: [0.000, 0.000, 0.055], forward_xyz: [0.000, 0.000, 1.000], approximate_clear_fraction: null, minimum_clear_fraction: 0.95, pending: true, pending_reason: dynamic_arm_pose_occlusion_scan}

validation_policy:
  static_frame_position_tolerance_m: 0.005
  static_frame_rotation_tolerance_rad: 0.020
  require_inertial_on_every_physical_link: true
  inertial_exempt_virtual_frames: [base_footprint, ur5e_base_link]
  require_positive_definite_inertia: true
  require_physical_inertia_triangle_inequalities: true
  forbidden_symbolic_tokens: ["${", "$(", TODO, TBD, PLACEHOLDER, REPLACE_ME]
  required_joint_limits: [revolute, prismatic, continuous]
  approved_pending_gates:
    - exact_s100_board_envelope
    - full_inertia_and_cog_scan
    - fov_occlusion_solve
    - final_wastewater_capacity
    - detailed_power_topology
    - arm_exact_swept_volume
    - cleaning_ground_contact
    - gazebo_sensor_ray_and_visibility_scan
  final_claims_forbidden_while_pending:
    - final_vehicle_cog_passed
    - final_wastewater_capacity_frozen
    - exact_sensor_mounts_frozen
    - s100_physical_integration_passed
    - gazebo_high_fidelity_vehicle_executed
