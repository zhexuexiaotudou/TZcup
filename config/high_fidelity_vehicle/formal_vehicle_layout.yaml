    left_camera_info: /sensors/front_rgbd/infra1/image_rect_raw/camera_info
    right_image: /sensors/front_rgbd/infra2/image_rect_raw
    right_camera_info: /sensors/front_rgbd/infra2/image_rect_raw/camera_info
  wrist_d435_ir_stereo:
    baseline_m: 0.050
    coordinate_reference: tool0
    left_frame: wrist_rgbd_infra1_optical_frame
    right_frame: wrist_rgbd_infra2_optical_frame
    left_image: /sensors/wrist_rgbd/infra1/image_rect_raw
    left_camera_info: /sensors/wrist_rgbd/infra1/image_rect_raw/camera_info
    right_image: /sensors/wrist_rgbd/infra2/image_rect_raw
    right_camera_info: /sensors/wrist_rgbd/infra2/image_rect_raw/camera_info

encoder_feedback:
  a300:
    physical_links: [front_left_encoder_link, front_right_encoder_link, rear_left_encoder_link, rear_right_encoder_link]
    simulated_counts_per_wheel_revolution: 4096
    simulated_resolution_source: engineering_parameter_not_published_Clearpath_specification
    hardware_resolution_pending: true
  pololu_4694:
    physical_links: [left_side_brush_encoder_link, right_side_brush_encoder_link, central_roller_encoder_link]
    motor_shaft_counts_per_revolution: 64
    nominal_gear_ratio: 70
    nominal_output_counts_per_revolution: 4480
    hardware_backlash_polarity_and_ratio_tolerance_pending: true

physical_power_service_layout:
  mass_redistribution_kg: 0.400
  source_lumped_pdu_mass_before_kg: 0.700
  source_lumped_pdu_mass_after_kg: 0.300
  isolator:
    housing_link: main_power_isolator_housing_link
    housing_joint: main_power_isolator_housing_joint
    handle_link: main_power_isolator_handle_link
    handle_joint: main_power_isolator_handle_joint
    measured_state_topic: /formal_vehicle/power/main_isolator_closed
  contactor:
    housing_link: main_power_contactor_housing_link
    housing_joint: main_power_contactor_housing_joint
    armature_link: main_power_contactor_armature_link
    armature_joint: main_power_contactor_armature_joint
    command_topic: /formal_vehicle/power/main_contactor_command
    measured_state_topic: /formal_vehicle/power/main_contactor_closed

compute_hardware:
  selected_model: D-Robotics_RDK_S100P_V1P0_user_owned
  provisional_reference_dimensions_m: [0.121, 0.120, 0.0524]
  modeled_collision_dimensions_m: [0.121, 0.120, 0.0524]
  protective_enclosure_internal_clear_dimensions_m: [0.174, 0.124, 0.064]
  external_envelope_pending: true
  validation: provisional_RDK_S100_reference_envelope_pending_owned_S100P_measurement
  unresolved_physical_validation: [exact_external_dimensions, mounting_hole_pattern, board_mass, thermal_rejection, connector_and_cable_service_space, live_power_and_compute_runtime]

validation_policy:
  static_frame_position_tolerance_m: 0.005
  static_frame_rotation_tolerance_rad: 0.020
  require_inertial_on_every_physical_link: true
  inertial_exempt_virtual_frames: [base_footprint, ur5e_base_link]
  require_positive_definite_inertia: true
  require_physical_inertia_triangle_inequalities: true
  forbidden_symbolic_tokens: ["${", "$(", TODO, TBD, PLACEHOLDER, REPLACE_ME]
  required_joint_limits: [revolute, prismatic, continuous]
  approved_pending_gates:
    - exact_s100p_board_envelope_and_mounting_pattern
    - s100_mass_thermal_connector_and_live_hardware_validation
    - detailed_power_topology
    - arm_exact_continuous_swept_volume
    - gazebo_sensor_ray_and_visibility_scan
  final_claims_forbidden_while_pending:
    - s100_mass_thermal_power_and_live_integration_passed
    - continuous_arm_joint_space_collision_free
    - real_hardware_calibrated
