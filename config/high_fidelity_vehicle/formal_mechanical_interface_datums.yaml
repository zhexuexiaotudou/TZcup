schema_version: 1
crosswalk_id: tzcup_formal_mechanical_interface_datums_v1
status: STATIC_DERIVED_SNAPSHOT_BOUND_NOT_MANUFACTURING_RELEASE

# This file is a nominal, zero-joint URDF crosswalk only.  It freezes neither
# manufacturing dimensions nor a machining/drawing datum system.
coordinate_contract:
  root_frame: base_footprint
  nominal_joint_configuration: zero
  pose_encoding: urdf_origin_xyz_m_rpy_rad
  static_position_tolerance_m: 0.001
  static_orientation_tolerance_rad: 0.001
  coordinate_semantics: >-
    Poses are the existing expanded-URDF link frames expressed from
    base_footprint. No independent datum-axis convention is introduced here.

manufacturing_release:
  released: false
  status: NOT_A_MANUFACTURING_RELEASE
  excluded_claims:
    - manufacturing_tolerances
    - bolt_torque_or_preload
    - material_strength_or_fatigue
    - machining_or_hole_pattern_release
    - real_hardware_fit_or_service_clearance
    - collision_or_cog_or_dynamic_contact_acceptance

# The validator fails closed when any of these source bytes change.  These are
# the exact files from which every pose/interface entry below was derived.
source_snapshot:
  algorithm: sha256
  inputs:
    - path: config/high_fidelity_vehicle/formal_vehicle_layout.yaml
      sha256: 3c9c10da558c116bcbedf39a516093ca20c1e3eb590e2bb2d121ebd491cf10a9
      role: nominal_layout_frames
    - path: config/high_fidelity_vehicle/formal_vehicle_component_register.yaml
      sha256: 83b8586c5ade5065cef9d44445fe4bc44c61adf4f1fd19786bd2ccf5a031b755
      role: component_and_functional_interface_register
    - path: reports/engineering/formal_competition_vehicle.urdf
      sha256: 2b399eaba8de34fd55ca663a3b6b49437070c72969f5e22faf2a64a12ba27db8
      role: expanded_zero_joint_urdf

# Each id/link pair is unique.  A datum may be reused by several interface
# chains but is declared only once, avoiding competing nominal coordinates.
datum_catalog:
  - datum_id: base_footprint_root
    link: base_footprint
    expected_root_pose: {xyz_m: [0.000000, 0.000000, 0.000000], rpy_rad: [0.000000, 0.000000, 0.000000]}
    layout_installation_frame: base_footprint
  - datum_id: chassis_top_plate
    link: payload_deck_link
    expected_root_pose: {xyz_m: [0.000000, 0.000000, 0.369100], rpy_rad: [0.000000, 0.000000, 0.000000]}
    layout_installation_frame: payload_deck_link
  - datum_id: arm_adapter_mount
