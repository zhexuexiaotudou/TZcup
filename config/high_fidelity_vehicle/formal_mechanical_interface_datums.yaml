interface_crosswalk:
  - interface_id: chassis_top_plate_to_arm_base
    datum_chain: [chassis_top_plate, arm_adapter_mount, arm_base_mechanical, arm_control_reference]
    mechanical_subassembly:
      id: manipulator
      expected: {parent_link: arm_mount_link, root_link: ur5e_base_link, controller: arm_controller, connection: reinforced_payload_deck_to_six_bolt_adapter}
    functional_position:
      id: manipulation
      expected: {parent_link: arm_mount_link, link: ur5e_base_link_inertia, interface: arm_controller}
    urdf_joints:
      - {name: payload_deck_joint, parent_link: base_link, child_link: payload_deck_link}
      - {name: arm_mount_joint, parent_link: payload_deck_link, child_link: arm_mount_link}
      - {name: ur5e_mount_joint, parent_link: arm_mount_link, child_link: ur5e_base_link}
      - {name: ur5e_base_link_inertia_joint, parent_link: ur5e_base_link, child_link: ur5e_base_link_inertia}
  - interface_id: chassis_top_plate_to_sensor_tower
    datum_chain: [chassis_top_plate, sensor_tower_base]
    mechanical_subassembly:
      id: sensor_tower
      expected: {parent_link: payload_deck_link, root_link: sensor_mast_link, connection: 190x150x16_mm_bolted_base_twin_30x30_mm_columns_three_cross_ties_and_gussets}
    urdf_joints:
      - {name: sensor_mast_joint, parent_link: payload_deck_link, child_link: sensor_mast_link}
  - interface_id: chassis_to_cleaning_head
    datum_chain: [base_footprint_root, cleaning_chassis_mount, cleaning_head_zero, cleaning_roller_axis]
    mechanical_subassembly:
      id: cleaning_head_deployment
      expected: {parent_link: cleaning_mechanism_mount_link, root_link: cleaning_lift_carriage_link, controller: cleaning_controller, actuator_link: cleaning_lift_actuator_body_link}
    functional_position:
      id: cleaning_head_lift
      expected: {parent_link: cleaning_mechanism_mount_link, link: cleaning_lift_carriage_link, interface: cleaning_controller, zero_position: transport_safe_raised, work_position_m: 0.100}
    urdf_joints:
      - {name: cleaning_mechanism_mount_joint, parent_link: base_link, child_link: cleaning_mechanism_mount_link}
      - {name: cleaning_lift_joint, parent_link: cleaning_mechanism_mount_link, child_link: cleaning_lift_carriage_link}
      - {name: central_roller_joint, parent_link: central_roller_drive_gearbox_link, child_link: central_roller_link}
  - interface_id: chassis_top_plate_to_dry_bin
    datum_chain: [chassis_top_plate, storage_shared_subframe, dry_bin_origin]
    mechanical_subassembly:
      id: dry_storage
      expected: {parent_link: storage_system_mount_link, root_link: dry_bin_link}
    functional_position:
      id: dry_storage
      expected: {parent_link: storage_system_mount_link, link: dry_bin_link, actuation: passive_manual_latch}
    urdf_joints:
      - {name: storage_system_mount_joint, parent_link: payload_deck_link, child_link: storage_system_mount_link}
      - {name: dry_bin_mount_joint, parent_link: storage_system_mount_link, child_link: dry_bin_link}
  - interface_id: chassis_top_plate_to_wastewater_tank
    datum_chain: [chassis_top_plate, storage_shared_subframe, wastewater_tank_origin]
    mechanical_subassembly:
      id: wastewater_storage
      expected: {parent_link: storage_system_mount_link, root_link: wastewater_tank_link}
    functional_position:
      id: wet_storage
      expected: {parent_link: storage_system_mount_link, link: wastewater_tank_link, actuation: passive_manual_latch, maintenance_drain_position: wastewater_drain}
    urdf_joints:
      - {name: storage_system_mount_joint, parent_link: payload_deck_link, child_link: storage_system_mount_link}
      - {name: wastewater_tank_mount_joint, parent_link: storage_system_mount_link, child_link: wastewater_tank_link}
  - interface_id: chassis_to_charge_receptacle
    datum_chain: [base_footprint_root, charge_housing_origin, charge_receptacle_endpoint]
    mechanical_subassembly:
      id: exterior_service_and_contact_safety
      expected: {parent_link: base_link, root_links_contains: charge_interface_datum_link}
    functional_position:
      id: charge_interface
      expected: {parent_link: base_link, link: charge_port_housing_link, actuation: passive_service_interlock, required_topic_contracts_contains: charge_receptacle_contact}
    urdf_joints:
      - {name: charge_port_housing_joint, parent_link: base_link, child_link: charge_port_housing_link}
      - {name: charge_receptacle_joint, parent_link: charge_port_housing_link, child_link: charge_receptacle_link}
  - interface_id: wastewater_tank_to_drain_hose
    datum_chain: [wastewater_tank_origin, wastewater_drain_valve_origin, wastewater_drain_hose_endpoint]
    mechanical_subassembly:
      id: exterior_service_and_contact_safety
      expected: {parent_link: base_link, root_links_contains: wastewater_drain_datum_link}
    functional_position:
      id: wastewater_drain
      expected: {parent_link: wastewater_tank_link, link: wastewater_drain_valve_body_link, interface: service_controller, actuator_link: wastewater_drain_valve_actuator_link, required_topic_contracts_contains: wastewater_drain_hose_contact}
    urdf_joints:
      - {name: wastewater_drain_pipe_joint, parent_link: wastewater_tank_link, child_link: wastewater_drain_pipe_link}
      - {name: wastewater_drain_valve_body_joint, parent_link: wastewater_drain_pipe_link, child_link: wastewater_drain_valve_body_link}
      - {name: wastewater_drain_coupling_joint, parent_link: wastewater_drain_valve_body_link, child_link: wastewater_drain_coupling_link}
