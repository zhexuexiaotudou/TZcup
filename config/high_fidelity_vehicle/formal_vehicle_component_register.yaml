schema_version: 6
register_id: tzcup_formal_vehicle_component_register_v6
coordinate_contract:
  default_reference: base_footprint
  nominal_joint_configuration: zero
  position_tolerance_m: 0.001
  orientation_tolerance_rad: 0.001
claim_boundary: >-
  The register freezes the selected public-reference component, parent/child
  mounting chain and nominal zero-joint installation pose. Dynamic equipment
  uses an explicit local coordinate reference. It does not claim proprietary
  internals, manufacturing tolerances, cable-flex life or certification.

navigation_sensor_semantics:
  mapping:
    dimensionality: 2d_occupancy_grid
    primary_sensor_installation: hokuyo_utm30lx
    topic_contract: lidar_2d_scan
    product_pipeline: slam_toolbox_utm_scan
  obstacle_perception:
    dimensionality: 3d_pointcloud
    primary_sensor_installation: livox_mid360
    topic_contract: lidar_3d_pointcloud
    product_pipeline: mid360_obstacle_layer
    mapping_claim: prohibited

topic_contracts:
  lidar_2d_scan: {ros_topic: /sensors/lidar_2d/scan, ros_type: sensor_msgs/msg/LaserScan, gz_type: gz.msgs.LaserScan, sensor_base_topic: /sensors/lidar_2d/scan}
