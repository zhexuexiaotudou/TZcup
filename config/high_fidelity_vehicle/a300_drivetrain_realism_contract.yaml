plant_model:
  core_header: starter_ws/src/sanitation_gazebo_control/include/sanitation_gazebo_control/A300DrivetrainPlantCore.hh
  core_source: starter_ws/src/sanitation_gazebo_control/src/A300DrivetrainPlantCore.cc
  gazebo_candidate_source: starter_ws/src/sanitation_gazebo_control/src/A300DrivetrainPlantSystem.cc
  typed_command_adapter_source: starter_ws/src/sanitation_gazebo_control/src/A300DrivetrainCommandAdapter.cc
  typed_transport_bridge_source: starter_ws/src/sanitation_gazebo_control/src/A300DrivetrainNativeBridge.cc
  transport_bridge_executable: a300_drivetrain_native_bridge
  test_source: starter_ws/src/sanitation_gazebo_control/test/test_a300_drivetrain_plant_core.cc
  candidate_compile_project: starter_ws/src/sanitation_gazebo_control/test/a300_drivetrain_candidate/CMakeLists.txt
  required_effects:
    - torque_speed_saturation
    - per_motor_continuous_current_limit
    - aggregate_battery_current_limit
    - aggregate_output_power_limit
    - resistive_brake_response_delay_and_ramp
    - command_timeout
    - emergency_stop
    - any_motor_fault_global_inhibit
    - invalid_input_fail_safe
  engineering_parameters_not_official:
    wheel_side_torque_constant_nm_per_a: 3.5
    low_speed_torque_limit_nm: 59.5
    speed_error_gain_nm_per_rad_s: 12.0
    torque_slew_rate_nm_per_s: 400.0
    service_brake_torque_limit_nm: 32.0
    brake_response_delay_s: 0.08
    brake_ramp_time_s: 0.12
    drivetrain_efficiency: 0.80
  integration_boundary:
    active_in_cmake: true
    loaded_by_current_vehicle: true
    current_runtime_behavior_changed: true
    remaining_requirements:
      - Correlate engineering parameters against measured coast-down, acceleration, current and stopping tests.
      - Re-run map, mobility, dynamic-obstacle and whole-vehicle safety acceptance after integration.
    typed_bridge_plan:
      ros_input: /base_controller/cmd_vel@geometry_msgs/msg/TwistStamped
      adapter_output: /model/tzcup_formal_sanitation_vehicle/a300_drivetrain/cmd_vel@geometry_msgs/msg/Twist
      gazebo_type: gz.msgs.Twist
      safety_enable_ros: /model/tzcup_formal_sanitation_vehicle/a300_drivetrain/actuator_enable@std_msgs/msg/Bool
      safety_enable_gazebo_type: gz.msgs.Boolean
      odometry_gazebo: /model/tzcup_formal_sanitation_vehicle/a300_drivetrain/odom@gz.msgs.Odometry
      odometry_ros_target: /odom/unfiltered@nav_msgs/msg/Odometry
    final_single_authority_plan:
      wheel_effort_writer: A300DrivetrainPlantSystem via gz.sim JointForceCmd
      diff_drive_controller_retained: false
      wheel_ros2_control_interfaces: [position_state, velocity_state]
      plant_raw_odometry_ros_topic: /odom/unfiltered
      plant_publishes_tf: false
      selected_odometry_topic: /odom
      selected_odometry_publisher: /local_ekf
      odom_to_base_tf_edge: odom->base_footprint
      odom_to_base_tf_publisher: /local_ekf
      local_ekf_base_link_frame: base_footprint
      mapping_map_to_odom_publisher: /slam_toolbox
      cleaning_map_to_odom_publisher: /global_ekf
      amcl_tf_broadcast: false
      legacy_topic_adapter_odometry_relay_present: false
      forbidden_parallel_writers:
        - diff_drive_controller wheel velocity command interfaces
        - base_controller odometry publication
        - plant odometry TF publication
        - legacy topic adapter /odom publication

